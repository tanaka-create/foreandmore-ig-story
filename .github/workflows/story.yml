name: フォア＆モア ストーリー自動投稿

# 毎朝 6:00 JST に1セット（日曜休み）。cron は UTC なので JST から9時間引いている。
# cron は遅れることがあるので 5:40 に起動して 6:00 まで待ち、遅れた日用に予備の起動も入れている
# （予備で起動しても、その日すでに出していれば何もしない）。
on:
  schedule:
    - cron: '40 20 * * 0-5'   # 05:40 JST（月〜土）
    - cron: '10 22 * * 0-5'   # 07:10 JST 予備
    - cron: '10 0 * * 1-6'    # 09:10 JST 予備
  workflow_dispatch:
    inputs:
      account:
        description: 'どの店舗で動かすか'
        type: choice
        options: [kurume, chikugo]
        default: kurume
      mode:
        description: 'dry_run=選ぶだけ / check=鍵と権限の確認 / post=今すぐ投稿 / notify_test=LINE通知のテスト'
        type: choice
        options: [dry_run, check, post, notify_test]
        default: dry_run

permissions:
  contents: write

concurrency:
  group: story-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'schedule' || github.event.inputs.account == 'kurume'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: ストーリーを投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
          NOTIFY_TEST: ${{ github.event.inputs.mode == 'notify_test' && '1' || '' }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            dry_run) python3 post_story.py --dry-run --force ;;
            check|notify_test) python3 post_story.py --check ;;
            post)    python3 post_story.py --force ;;
            *)       python3 post_story.py ;;
          esac
      - name: 投稿記録をコミットする
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "ストーリー投稿 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push origin main || (git pull --rebase origin main && git push origin main)

  chikugo:
    # 筑後店。リポジトリ変数 CHIKUGO_ENABLED を true にすると定時投稿が動く
    if: always() && ((github.event_name == 'schedule' && vars.CHIKUGO_ENABLED == 'true') || github.event.inputs.account == 'chikugo')
    needs: post
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 筑後のストーリーを投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID_CHIKUGO: ${{ secrets.IG_USER_ID_CHIKUGO }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID: ${{ secrets.LINE_GROUP_ID }}
        run: |
          git pull -q origin main || true
          case "${{ github.event.inputs.mode }}" in
            dry_run) python3 post_story.py --account chikugo --dry-run --force ;;
            check|notify_test) python3 post_story.py --account chikugo --check ;;
            post)    python3 post_story.py --account chikugo --force ;;
            *)       python3 post_story.py --account chikugo ;;
          esac
      - name: 投稿記録をコミットする
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history_chikugo.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "筑後ストーリー投稿 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push origin main || (git pull --rebase origin main && git push origin main)
